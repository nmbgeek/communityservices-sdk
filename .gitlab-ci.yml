stages:
  - verify
  - publish

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  GIT_SUBMODULE_STRATEGY: none
  SDK_DIRECTORY: packages/wellsky-sdk

.verify_sdk:
  stage: verify
  before_script:
    - cd "$SDK_DIRECTORY"
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run package:check
  cache:
    key:
      files:
        - packages/wellsky-sdk/package-lock.json
    paths:
      - packages/wellsky-sdk/.npm/

verify:node22:
  extends: .verify_sdk
  image: node:22-bookworm-slim
  artifacts:
    expire_in: 14 days
    paths:
      - packages/wellsky-sdk/*.tgz
      - packages/wellsky-sdk/package-artifact.json

verify:node24:
  extends: .verify_sdk
  image: node:24-bookworm-slim

verify:browser:
  extends: .verify_sdk
  image: node:22-bookworm-slim
  script:
    - npx playwright-core install --with-deps chromium
    - export WELLSKY_TEST_CHROME="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')"
    - npm run package:check

publish:npm:
  stage: publish
  image: node:22-bookworm-slim
  resource_group: wellsky-sdk-npm-release
  needs:
    - job: verify:node22
      artifacts: true
    - job: verify:node24
      artifacts: false
    - job: verify:browser
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_VERSION'
  script:
    - cd "$SDK_DIRECTORY"
    - npm ci --cache .npm --prefer-offline
    - node scripts/publish-gitlab.mjs
