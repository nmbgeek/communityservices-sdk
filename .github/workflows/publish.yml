name: Verify and publish SDK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/wellsky-sdk

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            browser: false
          - node: 24
            browser: false
          - node: 24
            browser: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/wellsky-sdk/package-lock.json
      - run: npm ci
      - if: matrix.browser
        run: |
          npx playwright-core install --with-deps chromium
          echo "WELLSKY_TEST_CHROME=$(node --input-type=module -e 'import {chromium} from "playwright-core"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"
      - run: npm run package:check
      - if: matrix.browser
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tested-sdk
          path: |
            packages/wellsky-sdk/choiceapps-communityservices-sdk-*.tgz
            packages/wellsky-sdk/package-artifact.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'nmbgeek/communityservices-sdk'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tested-sdk
          path: packages/wellsky-sdk
      - run: node scripts/publish-npm.mjs
        env:
          NPM_CONFIG_LOGLEVEL: verbose
